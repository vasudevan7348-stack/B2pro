<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="b2pro home" />
    <title>b2pro home</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Pacifico&display=swap" rel="stylesheet">

    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        /* ── Background Video ── */
        #bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: 0;
            pointer-events: none;
            opacity: 0.5;
        }

        /* ── Gradient Overlay ── */
        #gradient-overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            background: linear-gradient(to right,
                    rgba(0, 0, 0, 0.55) 0%,
                    rgba(0, 0, 0, 0.2) 100%);
            pointer-events: none;
        }

        /* ── Content Layer ── */
        #content {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 8vh;
            text-align: center;
        }

        /* ── Typography ── */
        .bebas-neue-regular {
            font-family: "Bebas Neue", sans-serif;
            font-weight: 400;
            font-style: normal;
        }

        .pacifico-regular {
            font-family: "Pacifico", cursive;
            font-weight: 400;
            font-style: normal;
        }

        /* ── Hero Title ── */
        .hero-title {
            font-size: clamp(5rem, 18vw, 14rem);
            color: #1A1A1A;
            line-height: 0.9;
            text-shadow: 0 4px 40px rgba(0, 0, 0, 0.4);
            user-select: none;
        }

        /* ── Button ── */
        .btn-explore {
            position: relative;
            display: inline-block;
            margin-top: 0.4rem;
            padding: 0.8rem 2.2rem;
            font-family: "Bebas Neue", sans-serif;
            font-size: clamp(1rem, 2.5vw, 1.4rem);
            letter-spacing: 0.15em;
            color: #ffffff;
            background: #000000;
            border: 2px solid #000000;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            overflow: hidden;
            isolation: isolate;
            transition: background 0.3s ease, color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
        }

        .btn-explore:hover {
            background: #000;
            border-color: #000;
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.3);
        }

        .btn-explore:active {
            transform: translateY(0);
            box-shadow: none;
        }

        /* ── Tagline ── */
        .tagline {
            margin-top: 0.6rem;
            font-size: clamp(1.2rem, 3.5vw, 2.5rem);
            color: #1A1A1A;
            line-height: 1;
            letter-spacing: 0.05em;
            font-family: "Pacifico", cursive;
            font-weight: 400;
            text-transform: none;
            user-select: none;
        }

        /* ── Responsive ── */
        @media (max-width: 480px) {
            .btn-explore {
                padding: 0.6rem 1.4rem;
            }
        }
    </style>
</head>

<body>

    <!-- Looping Background Video -->
    <video id="bg-video" src="assets/bg-video.mp4" autoplay loop muted playsinline preload="auto"></video>

    <!-- Gradient Overlay -->
    <div id="gradient-overlay"></div>

    <!-- Content -->
    <div id="content">
        <h1 class="bebas-neue-regular hero-title">B&sup2;PRO</h1>
        <button class="btn-explore bebas-neue-regular" id="exploreBtn"
            onclick="window.location.href='explore.html'">Click to Explore</button>
        <p class="tagline">dont be the average</p>
    </div>

</body>

</html>
