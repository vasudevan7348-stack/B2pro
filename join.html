<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Join the B²PRO Community — Start your journey today." />
    <title>B²PRO — Join the Movement</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0a0a;
        }

        /* ── Animated grain overlay ── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
            opacity: 0.5;
        }

        /* ── Radial green glow ── */
        body::after {
            content: '';
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70vw;
            height: 70vw;
            background: radial-gradient(circle, rgba(34, 197, 94, 0.12) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
            animation: pulse-glow 4s ease-in-out infinite;
        }

        @keyframes pulse-glow {

            0%,
            100% {
                opacity: 0.7;
                transform: translate(-50%, -50%) scale(1);
            }

            50% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.08);
            }
        }

        /* ── Back button ── */
        #btn-back {
            position: fixed;
            top: 2rem;
            left: 2rem;
            font-family: "Bebas Neue", sans-serif;
            font-size: 1rem;
            letter-spacing: 0.12em;
            color: #555;
            text-decoration: none;
            border: 1px solid #2a2a2a;
            border-radius: 4px;
            padding: 0.5rem 1.2rem;
            z-index: 10;
            transition: color 0.25s, border-color 0.25s;
        }

        #btn-back:hover {
            color: #fff;
            border-color: #fff;
        }

        /* ── Center stage ── */
        .stage {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }

        /* ── Eyebrow ── */
        .eyebrow {
            font-family: 'Inter', sans-serif;
            font-size: clamp(0.7rem, 1.5vw, 0.85rem);
            font-weight: 500;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: #22C55E;
            margin-bottom: 1.2rem;
            opacity: 0;
            transform: translateY(16px);
            animation: fade-up 0.8s ease forwards 0.3s;
        }

        /* ── Main headline ── */
        .headline {
            font-family: "Bebas Neue", sans-serif;
            font-size: clamp(3.5rem, 12vw, 9rem);
            letter-spacing: 0.05em;
            color: #ffffff;
            line-height: 0.95;
            margin-bottom: 1.5rem;
            opacity: 0;
            transform: translateY(24px);
            animation: fade-up 0.9s ease forwards 0.55s;
        }

        .headline span {
            color: #22C55E;
        }

        /* ── Subtext ── */
        .subtext {
            font-family: 'Inter', sans-serif;
            font-size: clamp(0.85rem, 1.5vw, 1.05rem);
            font-weight: 300;
            color: #888;
            max-width: 480px;
            line-height: 1.9;
            margin-bottom: 3rem;
            opacity: 0;
            transform: translateY(16px);
            animation: fade-up 0.9s ease forwards 0.8s;
        }

        /* ── CTA Button ── */
        .cta-btn {
            display: inline-block;
            font-family: "Bebas Neue", sans-serif;
            font-size: clamp(1rem, 2vw, 1.25rem);
            letter-spacing: 0.2em;
            color: #0a0a0a;
            background: #22C55E;
            border: none;
            border-radius: 6px;
            padding: 1rem 3rem;
            text-decoration: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateY(16px);
            animation: fade-up 0.9s ease forwards 1.1s;
            transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
            box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.5);
        }

        .cta-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.15);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s ease;
        }

        .cta-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(34, 197, 94, 0.4);
            background: #16a34a;
        }

        .cta-btn:hover::before {
            transform: scaleX(1);
        }

        .cta-btn:active {
            transform: translateY(0);
        }

        /* ── Ping ring around button ── */
        @keyframes ping {
            0% {
                transform: scale(1);
                opacity: 0.6;
            }

            100% {
                transform: scale(1.6);
                opacity: 0;
            }
        }

        .btn-wrapper {
            position: relative;
            display: inline-block;
            opacity: 0;
            animation: fade-up 0.9s ease forwards 1.1s;
        }

        .btn-wrapper .cta-btn {
            opacity: 1;
            transform: none;
            animation: none;
        }

        .ping-ring {
            position: absolute;
            inset: -6px;
            border-radius: 10px;
            border: 2px solid #22C55E;
            animation: ping 2s ease-out infinite 1.5s;
            pointer-events: none;
        }

        /* ── Divider dots ── */
        .dots {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2.5rem;
            opacity: 0;
            animation: fade-up 0.9s ease forwards 0.95s;
        }

        .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #333;
        }

        .dot.active {
            background: #22C55E;
        }

        /* ── Fade-up keyframe ── */
        @keyframes fade-up {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── Footer whisper ── */
        .whisper {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Inter', sans-serif;
            font-size: 0.72rem;
            font-weight: 400;
            letter-spacing: 0.15em;
            color: #333;
            text-transform: uppercase;
            opacity: 0;
            animation: fade-up 1s ease forwards 1.4s;
            white-space: nowrap;
        }

        /* ── Responsive ── */
        @media (max-width: 500px) {
            #btn-back {
                top: 1.2rem;
                left: 1.2rem;
            }

            .subtext {
                font-size: 0.85rem;
            }

            .cta-btn {
                padding: 0.85rem 2rem;
            }
        }
    </style>
</head>

<body>

    <a href="about.html" id="btn-back">← Back</a>

    <div class="stage">

        <div class="eyebrow">You're one step away</div>

        <div class="headline">
            Your Journey<br>Starts <span>Now</span>
        </div>

        <p class="subtext">
            No gimmicks. No shortcuts. Just a community of driven people
            who eat clean, train hard, and lift each other up every single day.
            Welcome to B²PRO.
        </p>

        <div class="dots">
            <div class="dot active"></div>
            <div class="dot active"></div>
            <div class="dot"></div>
        </div>

        <div class="btn-wrapper">
            <div class="ping-ring"></div>
            <a href="https://chat.whatsapp.com/FHhZgo7crA48B7on7kzvct?mode=gi_t" target="_blank"
                rel="noopener noreferrer" class="cta-btn">Join the Community Now</a>
        </div>

    </div>

    <div class="whisper">B²PRO · Strength · Nutrition · Community</div>

</body>

</html>
